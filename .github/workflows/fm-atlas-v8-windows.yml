name: FM Atlas V8 — Windows Release Build

on:
  pull_request:
    branches:
      - fix/r7.2.0-release-build-integration
    paths:
      - "application/R7.2.0/FM-Atlas-R7.2.0-Work/**"
      - ".github/workflows/fm-atlas-v8-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fm-atlas-v8-windows-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-release:
    name: Restore, build and publish (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Python for adapter validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and verify the supported fmsave reader
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check fmsave==0.12.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import fmsave; print('fmsave', fmsave.__version__); assert tuple(map(int, fmsave.__version__.split('.')[:3])) >= (0, 12, 4)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate save adapter syntax and streaming bundle tests
        shell: pwsh
        run: |
          python -m py_compile "application/R7.2.0/FM-Atlas-R7.2.0-Work/tools/Export-FMAtlas-Fmsave.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s "application/R7.2.0/FM-Atlas-R7.2.0-Work/tests/python" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show toolchain
        shell: pwsh
        run: dotnet --info

      - name: Restore solution
        shell: pwsh
        run: |
          $solution = "application/R7.2.0/FM-Atlas-R7.2.0-Work/FmAtlas.sln"
          dotnet restore $solution
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        shell: pwsh
        run: |
          $solution = "application/R7.2.0/FM-Atlas-R7.2.0-Work/FmAtlas.sln"
          dotnet build $solution --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run career import integration tests
        shell: pwsh
        run: |
          $solution = "application/R7.2.0/FM-Atlas-R7.2.0-Work/FmAtlas.sln"
          dotnet test $solution --configuration Release --no-build --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish self-contained Windows x64
        shell: pwsh
        run: |
          $project = "application/R7.2.0/FM-Atlas-R7.2.0-Work/src/FmAtlas/FmAtlas.csproj"
          dotnet publish $project --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output artifacts/FM-Atlas-V8-win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "artifacts/FM-Atlas-V8-win-x64/FmAtlas.exe")) {
            throw "Publish output does not contain FmAtlas.exe."
          }
          Compress-Archive -Path "artifacts/FM-Atlas-V8-win-x64/*" -DestinationPath "artifacts/FM-Atlas-V8-win-x64.zip" -Force
          Get-FileHash "artifacts/FM-Atlas-V8-win-x64.zip" -Algorithm SHA256 | Format-List

      - name: Upload V8 build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FM-Atlas-V8-win-x64
          path: artifacts/FM-Atlas-V8-win-x64.zip
          if-no-files-found: error
          retention-days: 14
