name: FM Atlas Windows Build

on:
  push:
    branches:
      - rebuild/**
  pull_request:
    branches:
      - main
      - rebuild/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Cross-build the Windows WPF target without depending on a Windows runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare diagnostics
        run: |
          mkdir -p artifacts/test-results
          dotnet --info | tee artifacts/dotnet-info.txt
          uname -a | tee artifacts/runner-info.txt

      - name: Restore Windows-targeted solution
        run: dotnet restore FMAtlas.sln -p:EnableWindowsTargeting=true

      - name: Build Windows-targeted solution
        run: dotnet build FMAtlas.sln --configuration Release --no-restore -p:EnableWindowsTargeting=true

      - name: Run automated tests
        run: dotnet test FMAtlas.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=FMAtlas.Tests.trx" --results-directory artifacts/test-results

      - name: Cross-publish self-contained Windows x64 app
        run: dotnet publish src/FMAtlas.Desktop/FMAtlas.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish -p:EnableWindowsTargeting=true

      - name: Verify and package desktop app
        run: |
          test -f artifacts/publish/FMAtlas.exe
          cd artifacts/publish
          zip -qr ../FMAtlas-win-x64.zip .
          cd ../..
          sha256sum artifacts/FMAtlas-win-x64.zip | tee artifacts/package-sha256.txt

      - name: Upload build, test and cross-build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-atlas-diagnostics-${{ github.run_number }}
          path: |
            artifacts/dotnet-info.txt
            artifacts/runner-info.txt
            artifacts/test-results/**
            artifacts/package-sha256.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows x64 test package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fm-atlas-win-x64-${{ github.run_number }}
          path: artifacts/FMAtlas-win-x64.zip
          if-no-files-found: error
          retention-days: 14
